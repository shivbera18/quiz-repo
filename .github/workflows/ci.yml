name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Every service's Prisma client generate step only needs this env var to be
  # PRESENT (schema validation), not a real reachable database -- none of
  # these jobs touch a live Postgres. See apps/assessment/tests/scoring.test.ts
  # for the one test suite that exists today (pure functions, no DB either).
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/quiz?schema=public"

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients (identity/catalog/assessment/analytics/notification)
        run: pnpm db:generate

      - name: Typecheck (all 11 workspace packages via turbo)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build apps/web (real Next.js production build, not just tsc)
        run: pnpm --filter web build

  # No e2e job here yet -- apps/web/tests-e2e/*.spec.ts predate the service
  # split and haven't been re-pointed at the gateway-backed flow (documented
  # as a known gap in HOSTING.md). Standing up the full 11-process stack +
  # Postgres/Redis/Redpanda/MinIO just to run specs that don't match the
  # current contract isn't worth the CI time or the false confidence yet --
  # a real follow-up, not silently dropped.
