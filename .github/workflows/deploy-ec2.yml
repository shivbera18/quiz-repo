# EC2 Deployment Trigger: Single repository push mode
name: Deploy Backend Stack to EC2
# Last deployment trigger: 2026-08-12

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "apps/identity/**"
      - "apps/catalog/**"
      - "apps/assessment/**"
      - "apps/analytics/**"
      - "apps/notification/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: SSH deploy + migrate
    runs-on: ubuntu-latest
    steps:
      - name: Normalize SSH private key
        id: ssh_key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_ssh_key.pem"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$key_file"
          if [ -n "$(tail -c 1 "$key_file")" ]; then
            echo "" >> "$key_file"
          fi
          chmod 600 "$key_file"
          echo "key_path=$key_file" >> "$GITHUB_OUTPUT"

      - name: Read normalized SSH key
        id: read_key
        run: |
          key_content=$(cat "${{ steps.ssh_key.outputs.key_path }}")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "key<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$key_content" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ steps.read_key.outputs.key }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            if [ -d "$HOME/quiz-platform" ]; then
              cd "$HOME/quiz-platform"
            elif [ -d "$HOME/quiz-repo-microservice" ]; then
              cd "$HOME/quiz-repo-microservice"
            elif [ -d "$HOME/quiz-repo" ]; then
              cd "$HOME/quiz-repo"
            else
              git clone https://github.com/shivbera18/quiz-repo.git "$HOME/quiz-platform"
              cd "$HOME/quiz-platform"
            fi

            git fetch origin main
            git reset --hard origin/main

            APP_SERVICES="gateway identity-svc \
                          catalog-svc catalog-ai-worker \
                          assessment-svc assessment-worker \
                          analytics-svc analytics-rollup-consumer analytics-export-worker \
                          notification-svc notification-worker \
                          caddy"

            # Free disk held by the previously running app containers/images before
            # building replacements.
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml stop $APP_SERVICES || true
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml rm -f $APP_SERVICES || true
            docker image prune -a -f
            docker builder prune -a -f --keep-storage 2GB

            # Tune Redpanda for low-RAM VM
            sed -i 's/--memory=512M/--memory=200M/' infra/docker-compose.yml

            # Build every service ONE AT A TIME (never batched, never
            # parallel) -- COMPOSE_PARALLEL_LIMIT=1 is a belt-and-suspenders
            # safety net on top of that. Two things this buys us on a
            # low-RAM t3.small:
            #
            # 1. Each app's API service is built immediately before its own
            #    worker(s). Both are now built from ONE multi-stage Dockerfile
            #    per app (see apps/*/Dockerfile) that shares a `base` stage --
            #    node_modules + the generated Prisma client. Building them
            #    back-to-back means the worker build is a 100% BuildKit cache
            #    hit (near-instant, zero additional layer storage) instead of
            #    an independent ~800MB rebuild racing the API build for the
            #    same pnpm store cache mount.
            # 2. No two `pnpm install` processes ever touch the shared
            #    `--mount=type=cache,id=pnpm` store at the same time, which
            #    used to cause CPU/RAM contention when Compose built several
            #    services in parallel.
            export COMPOSE_PARALLEL_LIMIT=1
            for svc in gateway identity-svc \
                       catalog-svc catalog-ai-worker \
                       assessment-svc assessment-worker \
                       analytics-svc analytics-rollup-consumer analytics-export-worker \
                       notification-svc notification-worker; do
              docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml build "$svc"
            done

            # Prune lingering stopped containers to prevent name conflicts
            docker container prune -f

            # Start the full backend stack. Data-plane containers first
            # (Compose already serializes these via depends_on/healthchecks),
            # then the app processes.
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
              up -d --remove-orphans \
              postgres redis redpanda minio minio-init \
              gateway identity-svc catalog-svc catalog-ai-worker \
              assessment-svc assessment-worker \
              analytics-svc analytics-rollup-consumer analytics-export-worker \
              notification-svc notification-worker \
              caddy

            # Reclaim the now-superseded previous images as early as
            # possible -- a fresh build set + the still-running old
            # containers can otherwise both be on disk at once, which is the
            # single biggest transient storage spike in this whole script.
            docker image prune -f

            # Wait 10 seconds for services to initialize
            sleep 10

            # Run Prisma database migrations
            docker compose -f infra/docker-compose.yml exec -T identity-svc pnpm --filter identity-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T catalog-svc pnpm --filter catalog-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T assessment-svc pnpm --filter assessment-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T analytics-svc pnpm --filter analytics-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T notification-svc pnpm --filter notification-svc db:migrate || true

            # Seed database initial data if needed
            docker compose -f infra/docker-compose.yml exec -T identity-svc pnpm --filter identity-svc db:seed || true
            docker compose -f infra/docker-compose.yml exec -T catalog-svc pnpm --filter catalog-svc db:seed || true

            # Clean up residual dangling layers
            docker image prune -f
