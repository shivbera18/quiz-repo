# Hybrid deployment: 3 data-plane containers in Docker (postgres, redis,
# redpanda), 11 Node processes under host PM2, MinIO as a host systemd unit,
# host Nginx for TLS. No application Docker images are ever built on the VPS.
#
# Storage budget on the VPS (30G /, ~11G free): this workflow adds ~0 net
# bytes per deploy -- `pnpm install` reuses the content-addressed store,
# `docker compose pull` only fetches changed layers, and no dangling images
# or tmp leftovers are ever created.
# Secrets this workflow needs (set in GitHub repo Settings > Secrets):
#   EC2_HOST     -- VPS public IP or hostname
#   EC2_SSH_KEY  -- private key for the `opc` user (update it there; nothing
#                   in this file changes when you rotate it)
# VPS-only files CI must never overwrite (both hold secrets, chmod 600):
#   ~/quiz-platform/infra/.env, ~/quiz-platform/ecosystem.config.cjs
name: Deploy Backend Stack to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "apps/identity/**"
      - "apps/catalog/**"
      - "apps/assessment/**"
      - "apps/analytics/**"
      - "apps/notification/**"
      - "packages/**"
      - "infra/docker-compose.infra.yml"
      - "infra/postgres/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: SSH deploy + migrate
    runs-on: ubuntu-latest
    steps:
      - name: Normalize SSH private key
        id: ssh_key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_ssh_key.pem"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$key_file"
          if [ -n "$(tail -c 1 "$key_file")" ]; then
            echo "" >> "$key_file"
          fi
          chmod 600 "$key_file"
          echo "key_path=$key_file" >> "$GITHUB_OUTPUT"

      - name: Read normalized SSH key
        id: read_key
        run: |
          key_content=$(cat "${{ steps.ssh_key.outputs.key_path }}")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "key<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$key_content" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: opc
          key: ${{ steps.read_key.outputs.key }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/quiz-platform" 2>/dev/null || {
              git clone https://github.com/shivbera18/quiz-repo.git "$HOME/quiz-platform"
              cd "$HOME/quiz-platform"
            }

            git fetch origin main
            git reset --hard origin/main

            # Data plane: 3 prebuilt images (postgres, redis, redpanda), never
            # built. `pull` is a no-op when tags are unchanged, so steady-state
            # deploys cost zero bytes here.
            docker compose -f infra/docker-compose.infra.yml pull
            docker compose -f infra/docker-compose.infra.yml up -d

            # JS deps: single shared pnpm store (~1.1G, content-addressed).
            # Unchanged packages are hardlinks, not downloads -- steady state
            # is a few MB, not ~5G of per-image node_modules rebuilds.
            # --prefer-offline avoids re-hitting the registry for pinned bits.
            pnpm install --frozen-lockfile --prefer-offline
            pnpm db:generate

            # Migrate + seed with host-side DATABASE_URLs from infra/.env
            # (VPS-only, never in CI). deploy only, never dev, against live.
            set -a
            # shellcheck source=/dev/null
            . infra/.env
            set +a
            export DATABASE_URL="postgresql://identity_rw:${IDENTITY_RW_PASSWORD}@localhost:5433/quiz?schema=identity"
            pnpm --filter identity-svc db:migrate
            export DATABASE_URL="postgresql://catalog_rw:${CATALOG_RW_PASSWORD}@localhost:5433/quiz?schema=catalog"
            pnpm --filter catalog-svc db:migrate
            export DATABASE_URL="postgresql://assessment_rw:${ASSESSMENT_RW_PASSWORD}@localhost:5433/quiz?schema=assessment"
            pnpm --filter assessment-svc db:migrate
            export DATABASE_URL="postgresql://analytics_rw:${ANALYTICS_RW_PASSWORD}@localhost:5433/quiz?schema=analytics"
            pnpm --filter analytics-svc db:migrate
            export DATABASE_URL="postgresql://notification_rw:${NOTIFICATION_RW_PASSWORD}@localhost:5433/quiz?schema=notification"
            pnpm --filter notification-svc db:migrate
            unset DATABASE_URL

            # Seeds are upserts (identity users, sample quiz) -- safe to
            # re-run every deploy; never seed assessment (no seed file).
            pnpm --filter identity-svc db:seed
            pnpm --filter catalog-svc db:seed

            # Restart the 11 quiz-* PM2 apps with fresh code+env.
            # Never touches the 4 existing fyndr processes.
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save

            # Pass/fail gate: every service must answer /healthz after reload.
            for p in 4000 4001 4002 4003 4004 4005; do
              curl -sf --max-time 10 "http://localhost:$p/healthz" >/dev/null \
                || { echo "healthz FAILED on port $p"; exit 1; }
            done
            echo "deploy ok: data plane + 11 PM2 apps + 6 healthz"
