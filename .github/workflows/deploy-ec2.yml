name: Deploy backend to EC2
# Last deployment trigger: 2026-08-12

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: SSH deploy + migrate
    runs-on: ubuntu-latest
    steps:
      - name: Normalize SSH private key
        id: ssh_key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_ssh_key.pem"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$key_file"
          if [ -n "$(tail -c 1 "$key_file")" ]; then
            echo "" >> "$key_file"
          fi
          chmod 600 "$key_file"
          echo "key_path=$key_file" >> "$GITHUB_OUTPUT"

      - name: Read normalized SSH key
        id: read_key
        run: |
          key_content=$(cat "${{ steps.ssh_key.outputs.key_path }}")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "key<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$key_content" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ steps.read_key.outputs.key }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            if [ -d "$HOME/quiz-platform" ]; then
              cd "$HOME/quiz-platform"
            elif [ -d "$HOME/quiz-repo-microservice" ]; then
              cd "$HOME/quiz-repo-microservice"
            elif [ -d "$HOME/quiz-repo" ]; then
              cd "$HOME/quiz-repo"
            else
              git clone https://github.com/shivbera18/quiz-repo-microservice.git "$HOME/quiz-platform"
              cd "$HOME/quiz-platform"
            fi

            git fetch origin main
            git reset --hard origin/main

            # Prune dangling build objects before building to guarantee free space
            docker image prune -f
            docker builder prune -f --keep-storage 2GB

            # Tune Redpanda for low-RAM VM
            sed -i 's/--memory=512M/--memory=200M/' infra/docker-compose.yml

            # Build and deploy backend stack (excluding web, since web runs on Vercel)
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
              up -d --build \
              postgres redis redpanda minio minio-init \
              gateway identity-svc catalog-svc catalog-ai-worker \
              assessment-svc assessment-worker \
              analytics-svc analytics-rollup-consumer analytics-export-worker \
              notification-svc notification-worker \
              caddy

            # Wait 10 seconds for services to initialize
            sleep 10

            # Run Prisma database migrations
            docker compose -f infra/docker-compose.yml exec -T identity-svc pnpm --filter identity-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T catalog-svc pnpm --filter catalog-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T assessment-svc pnpm --filter assessment-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T analytics-svc pnpm --filter analytics-svc db:migrate || true
            docker compose -f infra/docker-compose.yml exec -T notification-svc pnpm --filter notification-svc db:migrate || true

            # Seed database initial data if needed
            docker compose -f infra/docker-compose.yml exec -T identity-svc pnpm --filter identity-svc db:seed || true
            docker compose -f infra/docker-compose.yml exec -T catalog-svc pnpm --filter catalog-svc db:seed || true

            # Clean up residual dangling layers
            docker image prune -f
