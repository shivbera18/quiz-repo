# Hybrid deployment: data plane in Docker, 11 Node processes under host PM2.
# See the hybrid deploy plan: infra/docker-compose.infra.yml + ecosystem.config.cjs
# (VPS-only, holds secrets, never committed) + host Nginx for TLS.
name: Deploy Backend Stack to EC2
# Last deployment trigger: 2026-08-12

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "apps/identity/**"
      - "apps/catalog/**"
      - "apps/assessment/**"
      - "apps/analytics/**"
      - "apps/notification/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: SSH deploy + migrate
    runs-on: ubuntu-latest
    steps:
      - name: Normalize SSH private key
        id: ssh_key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_ssh_key.pem"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$key_file"
          if [ -n "$(tail -c 1 "$key_file")" ]; then
            echo "" >> "$key_file"
          fi
          chmod 600 "$key_file"
          echo "key_path=$key_file" >> "$GITHUB_OUTPUT"

      - name: Read normalized SSH key
        id: read_key
        run: |
          key_content=$(cat "${{ steps.ssh_key.outputs.key_path }}")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "key<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$key_content" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: opc
          key: ${{ steps.read_key.outputs.key }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            if [ -d "$HOME/quiz-platform" ]; then
              cd "$HOME/quiz-platform"
            elif [ -d "$HOME/quiz-repo-microservice" ]; then
              cd "$HOME/quiz-repo-microservice"
            elif [ -d "$HOME/quiz-repo" ]; then
              cd "$HOME/quiz-repo"
            else
              git clone https://github.com/shivbera18/quiz-repo.git "$HOME/quiz-platform"
              cd "$HOME/quiz-platform"
            fi

            git fetch origin main
            git reset --hard origin/main

            # Data plane only: pulls 4 prebuilt images, never builds.
            # No sed hacks, no COMPOSE_PARALLEL_LIMIT, no prod overlay
            # (host Nginx owns 80/443; Caddy would fight it).
            docker compose -f infra/docker-compose.infra.yml up -d

            # Single shared pnpm store replaces ~5 GB of per-image node_modules.
            pnpm install --frozen-lockfile
            pnpm db:generate

            # Host-side DATABASE_URLs from infra/.env (VPS-only, never in CI).
            # migrate deploy only -- never migrate dev against live data.
            set -a
            # shellcheck source=/dev/null
            . infra/.env
            set +a
            export DATABASE_URL="postgresql://identity_rw:${IDENTITY_RW_PASSWORD}@localhost:5433/quiz?schema=identity"
            pnpm --filter identity-svc db:migrate
            export DATABASE_URL="postgresql://catalog_rw:${CATALOG_RW_PASSWORD}@localhost:5433/quiz?schema=catalog"
            pnpm --filter catalog-svc db:migrate
            export DATABASE_URL="postgresql://assessment_rw:${ASSESSMENT_RW_PASSWORD}@localhost:5433/quiz?schema=assessment"
            pnpm --filter assessment-svc db:migrate
            export DATABASE_URL="postgresql://analytics_rw:${ANALYTICS_RW_PASSWORD}@localhost:5433/quiz?schema=analytics"
            pnpm --filter analytics-svc db:migrate
            export DATABASE_URL="postgresql://notification_rw:${NOTIFICATION_RW_PASSWORD}@localhost:5433/quiz?schema=notification"
            pnpm --filter notification-svc db:migrate
            unset DATABASE_URL

            # Seeds: identity + catalog only. assessment-svc has no seed
            # (its db:seed points at a nonexistent file -- known gap).
            pnpm --filter identity-svc db:seed || true
            pnpm --filter catalog-svc db:seed || true

            # Restart the 11 quiz-* PM2 apps with fresh code+env.
            # ecosystem.config.cjs and infra/.env live only on the VPS
            # (both hold secrets) -- CI must never overwrite them.
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save
