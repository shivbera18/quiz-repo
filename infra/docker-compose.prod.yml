# Hardening overlay for a deployment reachable from the public internet.
# Use together with the base file, never alone:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build <services...>
#
# What this changes: adds Caddy (the only container bound to a public
# interface, terminating TLS in front of the GATEWAY -- see infra/Caddyfile's
# own comment for why it's the gateway and not `web` in the Oracle+Vercel
# topology this file is written for). Internal microservices and data stores
# communicate strictly within the isolated Docker bridge network -- no host
# port proxies (docker-proxy) are created, eliminating host port collisions
# and preventing unauthorized host interface exposure.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy

  web:
    ports: []
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Remove host port overrides for internal services (gateway, identity, catalog,
  # assessment, analytics, notification, postgres, redis, redpanda, minio).
  # They communicate exclusively over the internal Docker network container-to-container.
  gateway:
    ports: []

  identity-svc:
    ports: []

  catalog-svc:
    ports: []

  assessment-svc:
    ports: []

  analytics-svc:
    ports: []

  notification-svc:
    ports: []

  postgres:
    ports: []

  redis:
    ports: []

  redpanda:
    ports: []

  redpanda-console:
    ports: []

  minio:
    ports: []

volumes:
  caddy-data:
  caddy-config:
